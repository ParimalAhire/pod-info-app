apiVersion: v1
kind: Service
metadata:
  name: pod-info-service
  labels:
    app: pod-info-app
spec:
  type: NodePort
  selector:
    app: pod-info-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # port of the Service inside the cluster
      targetPort: 5000  # containerPort of the pods
      nodePort: 30080   # port opened on the node (range 30000-32767)
